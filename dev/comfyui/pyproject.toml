[project]
name = "kandinsky-s2v"
description = "Kandinsky S2V 1.0 Lite and Pro distilled speech-to-video (talking avatar) models for ComfyUI"
version = "1.0.0"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "huggingface-hub>=0.36.0",
    "librosa>=0.10.2",
    "transformers>=4.52.0",
]

[project.urls]
Repository = "https://github.com/kandinskylab/kandinsky-s2v"
Documentation = "https://github.com/kandinskylab/kandinsky-s2v/tree/main/dev/comfyui"

[tool.comfy]
PublisherId = "kandinskylab"
DisplayName = "Kandinsky S2V"
Icon = "https://avatars.githubusercontent.com/u/242813463?v=4&s=400"
requires-comfyui = ">=0.38.0"
